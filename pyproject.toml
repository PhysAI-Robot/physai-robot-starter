[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "physai"
version = "0.0.2"
description = "Modular robotics starter for MuJoCo, ROS2, visual servoing, and learning workflows"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
    "mujoco>=3.2",
    "numpy>=2.0",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.6.0",
    "PyYAML>=6.0",
    # The browser viewer (physai.web, --serve). Base, not a "web" extra:
    # --viewer needs neither this nor an extra (mujoco.viewer ships with
    # mujoco above), and folding it in here means it is never a choice
    # someone has to make against `isaac` below (isaacsim-kernel pins
    # uvicorn==0.29.0 exactly; the >=0.29 floor here is deliberately loose
    # so that pin is a valid resolution, not a conflict, when isaac is
    # selected -- see docs/DECISIONS.md, D).
    "fastapi>=0.115",
    "uvicorn[standard]>=0.29",
    # Dev/test tooling. Base, not a "dev" extra: this is a starter repo you
    # clone and work in directly, not a library installed as someone else's
    # dependency, so there is no audience that wants physai without the
    # ability to run its own test suite.
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "import-linter>=2.1",
    # Training and inference: gymnasium for the GymnasiumAdapter; torch + lerobot for ACT and Diffusion
    # Policy (lerobot's `diffusion` extra brings diffusers). lerobot pins numpy<2.3.0 and isaacsim-kernel
    # pins numpy==2.3.1, so the numpy override under [tool.uv] forces numpy<2.3 for both (Isaac runs on 2.2.x).
    "gymnasium>=1.4.0,<2.0",
    "torch>=2.7,<2.12",
    "torchvision>=0.22,<0.27",
    "lerobot[diffusion]>=0.6.1",
    "scipy>=1.11",  # used by the research plugin's image edits
    # Newton physics and renderer (physai.sim.newton). Pinned to the Newton that isaacsim-core 6.2.0.0 pins,
    # which also fixes mujoco and mujoco-warp (3.12.0), so adding the `isaac` extra changes none of them.
    "newton[sim]==1.6.1",
    "trimesh>=4.6.8",  # loads the MJCF meshes
]

[project.optional-dependencies]
# Isaac Sim, the one optional part: several GB, an NVIDIA GPU and an accepted EULA (docs/DECISIONS.md, D).
# No macOS wheels. `uv sync --extra isaac` adds it to the default environment without changing a version
# the default already has.
isaac = ["isaacsim[all,extscache]==6.2.0.0; sys_platform != 'darwin'"]

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"

# CUDA torch on Windows: PyPI only ships the CPU build there. Explicit, so
# only torch and torchvision resolve from it.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128", marker = "sys_platform == 'win32'" }
torchvision = { index = "pytorch-cu128", marker = "sys_platform == 'win32'" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A model-attach conflict in the shared world means a robot's options silently
# lost to the world's; fail instead of scrolling past it.
filterwarnings = ["error::UserWarning:physai.sim.mujoco.world"]
markers = [
    "assets: requires downloaded SO-101 simulation assets",
    "ros2: requires ROS 2 and message packages",
    "integration: crosses multiple PhysAI module boundaries",
    "acceptance: validates a complete robot workflow",
    "slow: takes longer than a normal unit test",
    "isaac: requires isaacsim (uv sync --extra isaac); GPU-bound",
    "newton: requires newton (uv sync --extra newton); GPU-bound",
]

[tool.uv]
# One override: lerobot needs numpy<2.3 and isaacsim-kernel pins numpy==2.3.1, so no resolution satisfies
# both without it (Isaac runs on 2.2.x). Every other version follows the pins of isaacsim and lerobot.
override-dependencies = [
    "numpy>=2.0,<2.3",
]
index-strategy = "unsafe-best-match"

[tool.ty.rules]
unresolved-attribute = "ignore"

[tool.importlinter]
root_packages = ["physai"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "sim stays out of the ROS2 boundary"
type = "forbidden"
source_modules = ["physai.sim"]
forbidden_modules = ["physai.bridge", "rclpy"]

[[tool.importlinter.contracts]]
name = "policy, tasks, and planner depend on ports, not MuJoCo"
type = "forbidden"
source_modules = ["physai.policy", "physai.tasks", "physai.planner"]
forbidden_modules = ["mujoco"]
# policy.registry calls robots.registry.create_robot_policy() to build a
# robot-owned policy (e.g. so101's "demo") without importing the robot
# itself; robots.registry's *own* lazy-loaded robot implementations are what
# actually touch mujoco, several hops away and behind an opaque return value
# policy.registry never inspects. That path is accepted, not a violation of
# "policy depends on ports, not MuJoCo" — policy never sees a MuJoCo type.
ignore_imports = ["physai.policy.registry -> physai.robots.registry"]

[[tool.importlinter.contracts]]
name = "the robot description schema stays simulator-agnostic"
type = "forbidden"
source_modules = ["physai.robots.description"]
forbidden_modules = ["mujoco"]
# RobotDescription (frames, cameras, contact pads, actuators, per-simulator
# overrides) is the seam a future non-MuJoCo backend (e.g. Isaac Sim) reads
# too; a MuJoCo import here would mean the schema secretly assumes one
# simulator. Each simulator's own builder (e.g.
# `sim.mujoco.scenes.common.apply_description`) imports mujoco, not this
# module.

[[tool.importlinter.contracts]]
name = "isaacsim/omni/pxr stay confined to the isaac backend"
type = "forbidden"
source_modules = ["physai"]
forbidden_modules = ["isaacsim", "omni", "pxr"]
# Only physai.sim.isaac (SimulationApp lifecycle, RobotDescription -> USD)
# and robots.so101.isaac_env / robots.viperx300s.isaac_env (the RobotPorts built on top of it) may
# depend on Isaac Sim; every other module reaches it only through the
# RobotPort/RobotSpec ports, the way it reaches MuJoCo only through
# physai.sim.mujoco. Every import below is function-local (Isaac Sim's own
# modules are not import-safe before a SimulationApp exists), but grimp's
# static graph tracks those too, collapsed to each external package's
# top-level name.
ignore_imports = [
    "physai.sim.isaac.core -> isaacsim",
    "physai.sim.isaac.core -> omni",
    "physai.sim.isaac.description -> isaacsim",
    "physai.sim.isaac.description -> omni",
    "physai.sim.isaac.description -> pxr",
    "physai.sim.isaac.scene -> pxr",
    "physai.sim.isaac.objects -> pxr",
    "physai.robots.so101.isaac_env -> isaacsim",
    "physai.robots.so101.isaac_env -> omni",
    "physai.robots.so101.isaac_env -> pxr",
    "physai.robots.viperx300s.isaac_env -> isaacsim",
]

[[tool.importlinter.contracts]]
name = "newton/warp stay confined to the newton backend"
type = "forbidden"
source_modules = ["physai"]
forbidden_modules = ["newton", "warp"]
# Only physai.sim.newton (the SolverMuJoCo stepper and the tiled-camera renderer)
# may import them, inside the classes that use them, so importing physai never
# needs the newton extra. Everything else reaches Newton through a robot env
# or a renderer object (docs/DECISIONS.md, I).
ignore_imports = [
    "physai.sim.newton.core -> newton",
    "physai.sim.newton.core -> warp",
    "physai.sim.newton.render -> newton",
    "physai.sim.newton.render -> warp",
]

[[tool.importlinter.contracts]]
name = "mujoco, isaac and newton backends stay independent"
type = "independence"
modules = ["physai.sim.mujoco", "physai.sim.isaac", "physai.sim.newton"]
# Peer engine backends under physai.sim; none is another's implementation
# detail, so none may import another directly (a robot that needs several, e.g.
# so101, depends on each separately, and `robots.rendering` pairs them).

[[tool.importlinter.contracts]]
name = "the isaac backend does not depend on mujoco"
type = "forbidden"
source_modules = ["physai.sim.isaac"]
forbidden_modules = ["mujoco"]

[[tool.importlinter.contracts]]
name = "the workspace description stays simulator-agnostic"
type = "forbidden"
source_modules = ["physai.sim.workspace"]
forbidden_modules = ["mujoco", "isaacsim", "omni", "pxr"]
# The table, target, cubes and front camera both simulators build. Each
# backend's own builder (`sim.mujoco.scenes.common.build_manipulation_spec`,
# `sim.isaac.scene.add_workspace`) imports its engine, not this module.
