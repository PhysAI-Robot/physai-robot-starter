[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "physai"
version = "0.0.1"
description = "Phase 0 starter: SO-101 arm in MuJoCo with VLM planner + VLA policy seams"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
    "mujoco>=3.2",
    "numpy>=2.0,<2.3",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.6.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
training = ["gymnasium>=1.3.0,<2.0"]
vlm = ["anthropic>=1.4.0"]
smolvlm = ["torch>=2.7,<2.12", "transformers>=4.45", "Pillow>=10.0", "huggingface-hub>=0.36.2"]
vla = ["torch>=2.7,<2.12", "lerobot>=0.6.1"]
dev = ["pytest>=9.1.1", "lark>=1.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
override-dependencies = ["datasets>=5.0.1", "setuptools>=83"]
