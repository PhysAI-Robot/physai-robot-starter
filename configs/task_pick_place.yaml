# Configuration for the minimal single-cube pick-and-place task.
# Load it with `python scripts/run_sim.py --config configs/task_pick_place.yaml`.

robot: so101

task:
  name: pick_place
  scene: pick_place_minimal

scene:
  robot_xml: assets/so101/so101_new_calib.xml
  timestep: 0.002
  table_pos: [0.30, 0.0, 0.01]
  table_size: [0.20, 0.25, 0.01]
  target_pos: [0.20, -0.10, 0.021]
  target_radius: 0.035
  cube_names: [cube]
  cube_half: 0.014
  cube_pos: [0.20, 0.08, 0.036]
  cube_mass: 0.03
  cube_rgba: [0.85, 0.25, 0.2, 1.0]

env:
  control_hz: 25
  render: true
  cameras: [front, wrist]
  max_steps: 400
  randomize_cube: true
  cube_x_range: [0.20, 0.24]
  cube_y_range: [0.05, 0.13]
  randomize_target: false
  success_xy_tol: 0.04
  success_hold_steps: 10
