# Two robot instances, one MuJoCo model, one clock: the multi-embodiment
# session the shared-world web path is built for. Several robots always share
# one world; the optional `world:` block sets its timestep, control rate, and
# floor. Shared-world sessions are command/hold only for now, so no `task` or
# `policy` is set. No `scene:` is set because the pick-and-place scenes are
# so101-only (fixed_base_manipulator).
schema_version: 1

backend: direct

world:
  timestep: 0.002
  control_hz: 30.0
  add_floor: true

robots:
  - id: arm_1
    robot: so101
    model: assets/so101/so101_new_calib_camera.xml
    pose:
      position: [0.3, 0.0, 0.0]
  - id: base_1
    robot: turtlebot4
    model: assets/turtlebot4/turtlebot4.xml
    pose:
      position: [-0.3, 0.0, 0.1]

viewer:
  mode: web
