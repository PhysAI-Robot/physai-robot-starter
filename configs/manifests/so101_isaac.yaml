# SO-101 on Isaac Sim instead of MuJoCo. Run it (needs isaacsim installed,
# see README.md) with:
#   python scripts/run_sim.py --manifest configs/manifests/so101_isaac.yaml
# Sets no `task`: SO101IsaacEnv is robot-only for now (no scene/task objects
# yet, see docs/adr/simulators.md, ADR 13), so a manifest that
# names one fails at construction. `policy: constant` because the headless
# default ("scripted") needs MuJoCo-only ArmKinematics. --serve works; --viewer is
# MuJoCo-only. Verified end to end (see docs/adr/simulators.md, ADR 16).
schema_version: 1

simulator: isaac
policy: constant

robots:
  - id: arm_1
    robot: so101
    config:
      render: false
