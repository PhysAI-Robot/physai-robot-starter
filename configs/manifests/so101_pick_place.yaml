# The minimal single-cube pick-and-place session for the SO-101.
# Run it with: python scripts/run_sim.py --manifest configs/manifests/so101_pick_place.yaml
# (this replaces configs/tasks/so101/pick_place.yaml).
schema_version: 1

backend: direct

scene:
  name: pick_place_minimal
  overrides:
    robot_xml: assets/so101/so101_new_calib_camera.xml
    timestep: 0.002
    table_pos: [0.30, 0.0, 0.01]
    table_size: [0.20, 0.25, 0.01]
    target_pos: [0.20, -0.10, 0.021]
    target_radius: 0.035
    cube_names: [cube]
    cube_half: 0.014
    cube_pos: [0.20, 0.08, 0.036]
    cube_mass: 0.03
    cube_rgba: [0.85, 0.25, 0.2, 1.0]

task: pick_place
task_kwargs:
  success_xy_tol: 0.04
success_hold_steps: 10

robots:
  - id: so101
    robot: so101
    config:
      control_hz: 30
      cameras: [front, wrist]
      max_steps: 400
      randomize_cube: true
      cube_x_range: [0.20, 0.24]
      cube_y_range: [0.05, 0.13]
      randomize_target: false

viewer:
  mode: none
