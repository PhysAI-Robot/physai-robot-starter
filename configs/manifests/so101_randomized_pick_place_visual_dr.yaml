# Study 1's randomized task with the MuJoCo look randomized each episode (robot, table and
# floor colours, floor tile size, lighting), for collecting demonstrations that a policy
# trains on (research/studies/01_randomized_pick_place.md, M5). Physics, the cube and the
# target keep their nominal values; evaluation uses so101_randomized_pick_place.yaml.
# The ranges are broad around nominal and were not fitted to Isaac Sim's measured differences.
schema_version: 1

simulation:
  seed: 0
  domain_randomization:
    enabled: true
    friction_scale: [1.0, 1.0]
    mass_scale: [1.0, 1.0]
    lighting_scale: [0.5, 1.4]
    arm_tint: [0.5, 1.2]
    table_tint: [0.7, 1.1]
    floor_tint: [0.5, 1.0]
    floor_tile_repeat: [3.0, 12.0]

scene:
  name: single_cube_place
  overrides:
    robot_xml: assets/so101/so101_new_calib_camera.xml
    timestep: 0.002
    table_pos: [0.30, 0.0, 0.01]
    table_size: [0.20, 0.25, 0.01]
    target_pos: [0.20, -0.10, 0.021]
    target_radius: 0.035
    cube_names: [cube]
    cube_half: 0.014
    cube_pos: [0.20, 0.08, 0.036]
    cube_mass: 0.03
    cube_rgba: [0.85, 0.25, 0.2, 1.0]

task: single_cube_place
task_kwargs:
  success_xy_tol: 0.04
success_hold_steps: 10

robots:
  - id: so101
    robot: so101
    config:
      control_hz: 30
      cameras: [front, wrist]
      max_steps: 600
      randomize_cube: true
      cube_x_range: [0.14, 0.27]
      cube_y_range: [-0.14, 0.14]
      randomize_target: true
      target_x_range: [0.14, 0.27]
      target_y_range: [-0.14, 0.14]
      # Distance from the base: drops the near-base hole and the far corners.
      spawn_radius_range: [0.16, 0.255]
      min_cube_target_distance: 0.08

viewer:
  mode: none
