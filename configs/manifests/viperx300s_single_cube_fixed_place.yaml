# The single-cube pick-and-place session for the ALOHA follower arm (ViperX 300 S).
# Fetch the model once:   python scripts/fetch_assets.py --robot viperx300s
# Run it with:            python scripts/run_sim.py --manifest configs/manifests/viperx300s_single_cube_fixed_place.yaml --policy constant --serve
# The scripted expert is a research policy: research/configs/viperx300s_single_cube_randomized_place.yaml.
schema_version: 1

scene:
  name: single_cube_place
  overrides:
    robot_xml: assets/viperx300s/vx300s.xml
    timestep: 0.002
    table_pos: [0.35, 0.0, 0.01]
    table_size: [0.25, 0.30, 0.01]
    target_pos: [0.32, -0.11, 0.021]
    target_radius: 0.04
    cube_names: [cube]
    cube_half: 0.014
    cube_pos: [0.32, 0.10, 0.034]
    cube_mass: 0.03
    cube_rgba: [0.85, 0.25, 0.2, 1.0]

task: single_cube_place
task_kwargs:
  success_xy_tol: 0.04
success_hold_steps: 10

robots:
  - id: viperx300s
    robot: viperx300s
    config:
      control_hz: 30
      cameras: [front, wrist]
      max_steps: 600
      randomize_cube: true
      cube_x_range: [0.28, 0.38]
      cube_y_range: [0.05, 0.15]
      randomize_target: false

viewer:
  mode: none
