name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.12 tests
    runs-on: ubuntu-24.04
    env:
      MUJOCO_GL: osmesa
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install headless rendering support
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libosmesa6-dev

      - name: Cache robot assets
        uses: actions/cache@v5
        with:
          path: assets
          key: robot-assets-${{ runner.os }}-${{ hashFiles('scripts/fetch_assets.py') }}

      - name: Fetch robot assets
        run: |
          uv run python scripts/fetch_assets.py --robot so101
          uv run python scripts/fetch_assets.py --robot turtlebot4

      - name: Install project and test dependencies
        run: uv sync --locked --extra dev

      - name: Run test suite
        run: uv run python -m pytest tests/ -q

  ros2-acceptance:
    name: ROS2 Jazzy SO-101 acceptance
    runs-on: ubuntu-24.04
    env:
      MUJOCO_GL: osmesa
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Cache robot assets
        uses: actions/cache@v5
        with:
          path: assets
          key: robot-assets-${{ runner.os }}-${{ hashFiles('scripts/fetch_assets.py') }}

      - name: Fetch robot assets
        run: |
          python scripts/fetch_assets.py --robot so101
          python scripts/fetch_assets.py --robot turtlebot4

      - name: Build ROS2 test image
        run: docker build --tag physai-ros2-test --file docker/Dockerfile .

      - name: Run real rclpy acceptance test
        run: |
          docker run --rm \
            --env MUJOCO_GL=osmesa \
            --volume "$GITHUB_WORKSPACE/assets:/workspace/assets:ro" \
            physai-ros2-test \
            bash -lc 'source /opt/ros/jazzy/setup.bash && uv run python -m pytest tests/robots/so101/test_ros2_node.py tests/robots/turtlebot/test_ros2_node.py -q'
