name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    name: Ruff format check
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install formatting dependencies
        run: uv sync --locked

      - name: Check Python formatting
        run: uv run ruff format --check --exclude .venv --exclude venv

  test-core:
    name: Python 3.12 core tests
    runs-on: ubuntu-24.04
    env:
      MUJOCO_GL: osmesa
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install headless rendering support
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libosmesa6-dev

      - name: Cache robot assets
        uses: actions/cache@v5
        with:
          path: assets
          key: robot-assets-${{ runner.os }}-${{ hashFiles('scripts/fetch_assets.py') }}

      - name: Fetch robot assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          uv run python scripts/fetch_assets.py --robot so101
          uv run python scripts/fetch_assets.py --robot turtlebot4

      - name: Install project and test dependencies
        run: uv sync --locked --extra training

      - name: Run core test suite
        run: |
          uv run python - <<'PY'
          import os
          import sys

          import pytest

          # mujoco.Renderer under MUJOCO_GL=osmesa segfaults during CPython's
          # normal interpreter shutdown on this runner, after pytest has
          # already reported its result. os._exit() reports pytest's real
          # exit code while skipping that unsafe native-library teardown.
          exit_code = pytest.main(["tests/core/", "-q", "-rf"])
          sys.stdout.flush()  # os._exit() would drop pytest's buffered report
          os._exit(exit_code)
          PY

  test-research:
    name: Python 3.12 research tests
    if: ${{ github.event.pull_request.head.repo.fork != true && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-24.04
    env:
      MUJOCO_GL: osmesa
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

    steps:
      - name: Check out repository and the private research submodule
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.RESEARCH_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install headless rendering support
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libosmesa6-dev

      - name: Cache robot assets
        uses: actions/cache@v5
        with:
          path: assets
          key: robot-assets-${{ runner.os }}-${{ hashFiles('scripts/fetch_assets.py') }}

      - name: Fetch robot assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run python scripts/fetch_assets.py --robot so101

      - name: Install project and test dependencies
        run: uv sync --locked --extra training

      - name: Run research test suite
        run: |
          uv run python - <<'PY'
          import os
          import sys

          import pytest

          # mujoco.Renderer under MUJOCO_GL=osmesa segfaults during CPython's
          # normal interpreter shutdown on this runner, after pytest has
          # already reported its result. os._exit() reports pytest's real
          # exit code while skipping that unsafe native-library teardown.
          exit_code = pytest.main(["research/tests/", "-q", "-rf"])
          sys.stdout.flush()  # os._exit() would drop pytest's buffered report
          os._exit(exit_code)
          PY

  ros2-acceptance:
    name: ROS2 Jazzy robot acceptance
    runs-on: ubuntu-24.04
    env:
      MUJOCO_GL: osmesa
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Cache robot assets
        uses: actions/cache@v5
        with:
          path: assets
          key: robot-assets-${{ runner.os }}-${{ hashFiles('scripts/fetch_assets.py') }}

      - name: Fetch robot assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/fetch_assets.py --robot so101
          python scripts/fetch_assets.py --robot turtlebot4

      - name: Build ROS2 test image
        run: docker build --tag physai-ros2-test --file docker/Dockerfile .

      - name: Run ROS2 robot acceptance tests
        run: |
          docker run --rm \
            --env MUJOCO_GL=osmesa \
            --volume "$GITHUB_WORKSPACE/assets:/workspace/assets:ro" \
            physai-ros2-test \
            bash -lc 'source /opt/ros/jazzy/setup.bash && uv run python -m pytest tests/core/robots/ -q'
