version: 2
updates:
  - package-ecosystem: uv
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch